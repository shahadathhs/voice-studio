name: CI

# Runs on pull requests into main and on pushes to main, not on every push to dev. To check dev on
# demand: gh workflow run ci.yml --ref dev
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  web:
    name: UI (lint, types, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec oxlint --type-aware .
      - run: pnpm exec prettier --check .
      - run: pnpm typecheck
      - run: pnpm --dir desktop build

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Install Tauri system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev
      # The Tauri shell embeds the built UI at compile time.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile && pnpm --dir desktop build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        if: runner.os != 'Windows'
      # The desktop crate's unit-test program does not start on Windows (it lacks the application
      # manifest that the Tauri build gives the app itself: STATUS_ENTRYPOINT_NOT_FOUND). Its
      # code is still compiled and linted above, and tested on the other two systems.
      - run: cargo test --workspace --exclude vtt-desktop
        if: runner.os == 'Windows'
