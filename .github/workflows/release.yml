# Publishes Voice Studio vX.Y.Z. A push to main releases the version named in VERSION when that
# version has no release yet (written by `make release v=X.Y.Z`); a pushed v* tag does the same.
# Every other main push only runs the checks in ci.yml. See docs/releasing.md.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      is-release: ${{ steps.ver.outputs.is-release }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(tr -d '[:space:]' < VERSION)"
          fi
          if gh release view "v${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "is-release=false" >> "$GITHUB_OUTPUT"
          else
            echo "is-release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.os }})
    needs: version
    if: needs.version.outputs.is-release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Install Tauri system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the installers
        run: pnpm --dir desktop tauri build
      - name: Build the command-line tool
        run: cargo build --release -p vtt-cli
      - name: Collect the files
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir out
          find target/release/bundle -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.deb' \
               -o -name '*.rpm' -o -name '*.AppImage' \) -exec cp {} out/ \;
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            7z a "out/vtt-${VERSION}-windows.zip" ./target/release/vtt.exe
          else
            tar -czf "out/vtt-${VERSION}-${RUNNER_OS}.tar.gz" -C target/release vtt
          fi
          cd out && for f in *; do shasum -a 256 "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v7
        with:
          name: voice-studio-${{ runner.os }}
          path: out/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Voice Studio v${VERSION}" \
            --generate-notes --latest
