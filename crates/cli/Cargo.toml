[package]
name = "vtt-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Forwarded to vtt-core; see its Cargo.toml.
vulkan = ["vtt-core/vulkan"]
cuda = ["vtt-core/cuda"]

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
vtt-core = { path = "../core" }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[[bin]]
name = "vtt"
path = "src/main.rs"
